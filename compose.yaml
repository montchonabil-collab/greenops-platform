name: greenops

services:
  reverse-proxy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
    depends_on:
      - gateway
    networks:
      - edge
      - backend

  gateway:
    build:
      context: ./services
      dockerfile: gateway/Dockerfile
    environment:
      SERVICE_NAME: gateway
      AUTH_URL: http://auth-service:8080
      ENERGY_URL: http://energy-service:8080
      ALERTS_URL: http://alerts-service:8080
    depends_on:
      - auth-service
      - energy-service
      - alerts-service
    networks:
      - backend

  auth-service:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    environment:
      SERVICE_NAME: auth-service
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    networks:
      - backend

  energy-service:
    build:
      context: ./services
      dockerfile: energy/Dockerfile
    environment:
      SERVICE_NAME: energy-service
      DATABASE_URL: ${DATABASE_URL:-postgres://greenops:greenops@postgres:5432/greenops?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - data

  alerts-service:
    build:
      context: ./services
      dockerfile: alerts/Dockerfile
    environment:
      SERVICE_NAME: alerts-service
      DATABASE_URL: ${DATABASE_URL:-postgres://greenops:greenops@postgres:5432/greenops?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - data

  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenops}
      POSTGRES_DB: ${POSTGRES_DB:-greenops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenops} -d ${POSTGRES_DB:-greenops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  prometheus:
    image: quay.io/prometheus/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
      - monitoring

  grafana:
    image: public.ecr.aws/bitnami/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-greenops}
      GF_PATHS_PROVISIONING: /opt/bitnami/grafana/conf/provisioning
    volumes:
      - grafana_data:/opt/bitnami/grafana/data
      - ./monitoring/grafana/provisioning/datasources/prometheus.yml:/opt/bitnami/grafana/conf/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/dashboards/greenops.yml:/opt/bitnami/grafana/conf/provisioning/dashboards/greenops.yml:ro
      - ./monitoring/grafana/dashboards:/opt/bitnami/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  edge:
  backend:
  data:
  monitoring:

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
