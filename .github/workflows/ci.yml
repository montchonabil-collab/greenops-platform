name: GreenOps CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/go.sum

      - name: Test services
        working-directory: services
        run: go test ./...

      - name: Build Linux binaries
        run: bash ./scripts/build-linux.sh

      - name: Validate Docker Compose
        run: docker compose config

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.6

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s > /tmp/greenops-k8s.yaml
          test -s /tmp/greenops-k8s.yaml
