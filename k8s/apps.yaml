apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: auth-service
          image: greenops-auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: auth-service
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: greenops-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: energy-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: energy-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: energy-service
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: energy-service
          image: greenops-energy-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: energy-service
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greenops-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://greenops:$(POSTGRES_PASSWORD)@postgres:5432/greenops?sslmode=disable
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: greenops-config
                  key: REDIS_ADDR
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 15
          resources:
            requests:
              cpu: 75m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: energy-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: energy-service
  ports:
    - name: http
      port: 8080
      targetPort: http
